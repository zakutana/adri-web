<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Stránka nenalezena | Adriana Chylová</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf{min-height:100svh;display:grid;place-items:center;text-align:center;padding:2rem var(--gutter)}
    .nf img{width:120px;height:120px;border-radius:50%;margin:0 auto 1.6rem;box-shadow:0 0 0 2px rgba(241,223,180,.55),0 0 0 8px rgba(7,16,58,.9),0 0 70px rgba(138,112,255,.75)}
    .nf h1{font:600 clamp(1.8rem,4.5vw,3rem)/1.1 var(--caps);letter-spacing:.05em;text-transform:uppercase;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .nf p{margin:1rem auto 2rem;max-width:34ch;font:italic 500 1.4rem/1.4 var(--serif);color:var(--gold-200)}
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/img/logo-240.webp" alt="Logo TCM" width="120" height="120">
      <h1>Stránka nenalezena</h1>
      <p>Tuhle adresu tu nenajdu. Pojďte zpátky na úvod.</p>
      <a class="btn" href="/">Zpět na úvod</a>
    </div>
  </main>
</body>
</html>
